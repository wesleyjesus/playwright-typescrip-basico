services:
  playwright:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        # Passa UID/GID do host para a build (lê .devcontainer/.env ou variáveis de ambiente)
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: playwright-custom
    container_name: playwright-devcontainer-intellij
    ipc: host
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_HTML_HOST=localhost
    working_dir: /home/pwuser/app
    ports:
      - "3000:3000"
      - "9323:9323"
    volumes:
      # Mount do projeto - use variável de ambiente para tornar opcional
      # VSCode monta automaticamente, IntelliJ pode não montar
      - ${PROJECT_MOUNT:-..}:/home/pwuser/app:cached
      # Volume nomeado para node_modules para evitar problemas de permissão
      - node_modules:/home/pwuser/app/node_modules
    extra_hosts:
      - "localhost:host-gateway"
    entrypoint: ["/usr/local/bin/devcontainer-entrypoint.sh"]
    command: >
      /bin/sh -c "npx -y playwright@latest run-server --port 3000 --host 0.0.0.0"
    init: true
    tty: true
    stdin_open: true

volumes:
  node_modules:

